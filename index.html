<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RESERVE</title>
<style>
  :root { --bg:#0b0a09; --ink:#f3ece2; --dim:#a89e90; --amber:#ff9933; --line:rgba(255,255,255,.10); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(120% 80% at 50% -10%, #1c1510 0%, var(--bg) 60%);
         color:var(--ink); display:flex; align-items:center; justify-content:center;
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,Roboto,sans-serif;
         -webkit-font-smoothing:antialiased; text-align:center; }
  .wrap { max-width:560px; padding:48px 24px; }
  .orb { width:120px; height:120px; margin:0 auto 28px; border-radius:50%;
         background:radial-gradient(circle at 38% 32%, #ffc017 0%, #ff7a18 45%, #c0390a 100%);
         box-shadow:0 0 60px rgba(255,140,40,.45), inset 0 -14px 30px rgba(0,0,0,.35); }
  .eyebrow { font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.42em;
             color:var(--amber); text-transform:uppercase; }
  h1 { font-size:40px; letter-spacing:.12em; margin:12px 0 10px; }
  p { color:var(--dim); margin:0 auto 32px; max-width:440px; }
  .links a { display:inline-block; margin:6px; padding:12px 22px; border:1px solid var(--line);
             border-radius:999px; color:var(--ink); text-decoration:none; font-size:15px; }
  .links a:hover { border-color:var(--amber); color:var(--amber); }
</style>
</head>
<body>
<div class="wrap">
  <div class="orb"></div>
  <div class="eyebrow">RESERVE</div>
  <h1>RESERVE</h1>
  <p>A living HUD of your metabolism — see your glycogen and fat reserves move in real time. Your data stays on your phone.</p>
  <div class="links">
    <a href="./privacy.html">Privacy Policy</a>
    <a href="./support.html">Support</a>
  </div>
</div>
</body>
</html>
